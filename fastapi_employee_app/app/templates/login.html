{% extends "base.html" %}
{% block title %}Login · Employee Management System{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title mb-4 text-center">Login</h3>
                <form id="login-form">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" class="form-control" id="username" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" class="form-control" id="password" required />
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Don't have an account? <a href="/signup">Sign up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("login-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    // The /auth/login endpoint expects OAuth2 "application/x-www-form-urlencoded"
    // data (via FastAPI's OAuth2PasswordRequestForm), not JSON.
    const form = new URLSearchParams();
    form.set("username", username);
    form.set("password", password);

    try {
        const res = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: form.toString(),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Login failed");

        EMS.setToken(data.access_token);
        window.location.href = "/dashboard";
    } catch (err) {
        EMS.showAlert(err.message, "danger");
    }
});
</script>
{% endblock %}
