{% extends "base.html" %}
{% block title %}Employee Records · Employee Management System{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Employee Records</h2>
    <a href="/employees-page/new" class="btn btn-success">+ Add Employee</a>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <form id="filter-form" class="row g-2 align-items-end">
            <div class="col-md-4">
                <label class="form-label">Search (name or email)</label>
                <input type="text" class="form-control" id="filter-search" placeholder="e.g. John" />
            </div>
            <div class="col-md-3">
                <label class="form-label">Department</label>
                <input type="text" class="form-control" id="filter-department" placeholder="e.g. IT" />
            </div>
            <div class="col-md-3">
                <label class="form-label">City</label>
                <input type="text" class="form-control" id="filter-city" placeholder="e.g. Hyderabad" />
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Filter</button>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Salary</th>
                    <th>City</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="employees-table-body">
                <tr><td colspan="9" class="text-center text-muted py-4">Loading...</td></tr>
            </tbody>
        </table>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center">
        <span id="pagination-info" class="text-muted small"></span>
        <div>
            <button id="prev-page" class="btn btn-sm btn-outline-secondary">Previous</button>
            <button id="next-page" class="btn btn-sm btn-outline-secondary">Next</button>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
EMS.requireAuth();

let currentPage = 1;
const pageLimit = 10;

function buildQuery() {
    const params = new URLSearchParams();
    const search = document.getElementById("filter-search").value.trim();
    const department = document.getElementById("filter-department").value.trim();
    const city = document.getElementById("filter-city").value.trim();
    if (search) params.set("search", search);
    if (department) params.set("department", department);
    if (city) params.set("city", city);
    params.set("page", currentPage);
    params.set("limit", pageLimit);
    return params.toString();
}

async function loadEmployees() {
    const tbody = document.getElementById("employees-table-body");
    tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">Loading...</td></tr>';
    try {
        const data = await EMS.api(`/employees?${buildQuery()}`);
        if (data.items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">No employees found.</td></tr>';
        } else {
            tbody.innerHTML = data.items
                .map(
                    (emp) => `
                <tr>
                    <td>${emp.employee_id}</td>
                    <td>${emp.first_name} ${emp.last_name}</td>
                    <td>${emp.email}</td>
                    <td>${emp.phone}</td>
                    <td>${emp.department}</td>
                    <td>${emp.designation}</td>
                    <td>${Number(emp.salary).toLocaleString()}</td>
                    <td>${emp.city}</td>
                    <td>
                        <a href="/employees-page/${emp.employee_id}" class="btn btn-sm btn-outline-primary">View</a>
                        <a href="/employees-page/${emp.employee_id}/edit" class="btn btn-sm btn-outline-secondary">Edit</a>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteEmployee(${emp.employee_id})">Delete</button>
                    </td>
                </tr>`
                )
                .join("");
        }

        const totalPages = Math.max(1, Math.ceil(data.total / pageLimit));
        document.getElementById("pagination-info").textContent =
            `Page ${data.page} of ${totalPages} (${data.total} total)`;
        document.getElementById("prev-page").disabled = currentPage <= 1;
        document.getElementById("next-page").disabled = currentPage >= totalPages;
    } catch (err) {
        EMS.showAlert(err.message, "danger");
    }
}

async function deleteEmployee(id) {
    if (!confirm("Delete this employee? This cannot be undone.")) return;
    try {
        await EMS.api(`/employees/${id}`, { method: "DELETE" });
        EMS.showAlert("Employee deleted.", "success");
        loadEmployees();
    } catch (err) {
        EMS.showAlert(err.message, "danger");
    }
}

document.getElementById("filter-form").addEventListener("submit", (e) => {
    e.preventDefault();
    currentPage = 1;
    loadEmployees();
});
document.getElementById("prev-page").addEventListener("click", () => {
    if (currentPage > 1) {
        currentPage -= 1;
        loadEmployees();
    }
});
document.getElementById("next-page").addEventListener("click", () => {
    currentPage += 1;
    loadEmployees();
});

loadEmployees();
</script>
{% endblock %}
